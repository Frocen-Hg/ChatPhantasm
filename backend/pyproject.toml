[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatphantasm"
version = "0.1.0"
description = "LLM 角色扮演平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai==2.9.0",
    "python-dotenv==1.2.1",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "alembic",
    "httpx",
]

[project.scripts]
chatphantasm-cli = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]